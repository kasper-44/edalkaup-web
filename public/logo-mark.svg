<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eðalkaup">
  <defs>
    <linearGradient id="edGold" x1="22" y1="20" x2="74" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e7cd78"/>
      <stop offset="0.5" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#9c7e2a"/>
